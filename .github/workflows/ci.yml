name: Build and validate ZEUS

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Shared rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Test core rules
        run: dotnet test tests/Zeus.Core.Tests/Zeus.Core.Tests.csproj -c Release --logger 'trx;LogFileName=core.trx'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-results
          path: tests/Zeus.Core.Tests/TestResults/*.trx

  windows:
    name: Windows build and diagnostic
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build native Windows application
        run: dotnet build Zeus.slnx -c Release
      - name: Test shared rules
        run: dotnet test tests/Zeus.Core.Tests/Zeus.Core.Tests.csproj -c Release --no-build
      - name: Exercise read-only Windows diagnostic
        run: dotnet run --project tools/Zeus.SmokeCheck/Zeus.SmokeCheck.csproj -c Release --no-build
      - name: Publish portable development package
        shell: pwsh
        run: ./scripts/publish-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: zeus-windows-x64
          path: artifacts/zeus-win-x64.zip
          if-no-files-found: error
