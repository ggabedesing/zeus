name: Build and validate ZEUS

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Portable rules and cleanup boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Test rules that run without Windows
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          for project in Zeus.Core.Tests Zeus.Cleanup.Tests Zeus.Maintenance.Protocol.Tests Zeus.UserOptimization.Tests Zeus.Hardware.Tests Zeus.Storage.Tests; do
            result_dir="$RUNNER_TEMP/zeus-test-results/$project"
            mkdir -p "$result_dir"
            if dotnet test "tests/$project/$project.csproj" -c Release -p:EnableWindowsTargeting=true --results-directory "$result_dir" --logger 'trx;LogFileName=results.trx' > "$result_dir/console.log" 2>&1; then
              tail -n 12 "$result_dir/console.log"
            else
              exit_code=$?
              cat "$result_dir/console.log"
              echo "Portable test project $project failed with exit code $exit_code." >&2
              python scripts/summarize-portable-tests.py "$result_dir" "$project" "$GITHUB_STEP_SUMMARY"
              failed=1
            fi
          done
          exit "$failed"
      - name: Require executed portable tests
        if: success()
        shell: python
        run: |
          import os, pathlib, xml.etree.ElementTree as ET
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'zeus-test-results'
          results = list(root.glob('*/results.trx'))
          assert len(results) == 6, 'Each portable test project must produce fresh results.'
          for result in results:
              counters = ET.parse(result).find('.//{*}Counters')
              assert counters is not None, f'Missing counters: {result.parent.name}'
              assert int(counters.attrib.get('total', 0)) > 0, f'No tests executed: {result.parent.name}'
              assert int(counters.attrib.get('passed', 0)) > 0, f'No tests passed: {result.parent.name}'
              assert int(counters.attrib.get('failed', 0)) == 0, f'Tests failed: {result.parent.name}'
      - name: Upload portable test results and console logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: zeus-portable-test-results
          path: ${{ runner.temp }}/zeus-test-results/
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Actual Windows application acceptance
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      ZEUS_WINDOWS_ACCEPTANCE: '1'
      ZEUS_SOURCE_SHA: ${{ github.sha }}
      ZEUS_SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
      ZEUS_BUILD_OUTCOME: pending
      ZEUS_TEST_OUTCOME: pending
      ZEUS_SMOKE_OUTCOME: pending
      ZEUS_PUBLISH_OUTCOME: pending
      ZEUS_INSTALLER_TEST_OUTCOME: pending
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Configure isolated acceptance directories
        shell: pwsh
        run: |
          "ZEUS_VALIDATION_DIR=$env:RUNNER_TEMP/zeus-validation/screenshots" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ZEUS_TEST_RESULTS=$env:RUNNER_TEMP/zeus-test-results" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build every project
        id: build
        run: dotnet build Zeus.slnx -c Release
      - name: Exercise all tests on the actual Windows runner
        id: windowsTests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: powershell
        run: |
          ./scripts/test-on-windows.ps1 -OutputDirectory $env:ZEUS_TEST_RESULTS -SkipBuild -NonInteractive
      - name: Exercise read-only Windows diagnostic
        id: smoke
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project tools/Zeus.SmokeCheck/Zeus.SmokeCheck.csproj -c Release --no-build
      - name: Publish portable Windows package
        id: publish
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: |
          $version = "1.0.$env:GITHUB_RUN_NUMBER"
          ./scripts/publish-windows.ps1 -ProductVersion $version
          ./scripts/package-windows-tests.ps1
          $payload = Get-ChildItem artifacts -Directory -Filter 'zeus-win-x64-*' | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          if ($null -eq $payload) { throw 'Published x64 application payload not found.' }
          ./scripts/build-installer.ps1 -PayloadDirectory $payload.FullName -ProductVersion $version
      - name: Install, upgrade, and uninstall MSI on the disposable runner
        id: installerTest
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        shell: pwsh
        env:
          ZEUS_TEST_PREVIOUS_MSI_DIR: ${{ runner.temp }}/zeus-installer-previous
          ZEUS_INSTALLER_SMOKE_LOGS: ${{ runner.temp }}/zeus-installer-smoke
        run: |
          $runNumber = [int]$env:GITHUB_RUN_NUMBER
          if ($runNumber -lt 1) { throw 'A valid MSI version number is needed for the upgrade check.' }
          $version = "1.0.$runNumber"
          $previousVersion = "1.0.$($runNumber - 1)"
          $payload = Get-ChildItem artifacts -Directory -Filter 'zeus-win-x64-*' | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          if ($null -eq $payload) { throw 'Published x64 application payload not found.' }
          ./scripts/build-installer.ps1 -PayloadDirectory $payload.FullName -ProductVersion $previousVersion -OutputDirectory $env:ZEUS_TEST_PREVIOUS_MSI_DIR
          ./scripts/test-installer-windows.ps1 -PreviousInstaller (Join-Path $env:ZEUS_TEST_PREVIOUS_MSI_DIR 'Zeus.Installer.msi') -CurrentInstaller (Join-Path $PWD 'artifacts/Zeus.Installer.msi') -ExpectedVersion $version -LogDirectory $env:ZEUS_INSTALLER_SMOKE_LOGS
      - name: Upload MSI lifecycle logs
        if: always() && steps.installerTest.outcome != 'skipped'
        uses: actions/upload-artifact@v6
        with:
          name: zeus-installer-lifecycle-logs
          path: ${{ runner.temp }}/zeus-installer-smoke/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload portable package
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: zeus-windows-x64
          path: |
            artifacts/zeus-win-x64.zip
            artifacts/zeus-win-x64.zip.sha256
          if-no-files-found: error
      - name: Upload MSI installer
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: zeus-installer-windows-x64
          path: |
            artifacts/Zeus.Installer.msi
            artifacts/Zeus.Installer.msi.sha256
          if-no-files-found: error
      - name: Upload tests for the user's Windows PC
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: zeus-tests-windows
          path: |
            artifacts/zeus-testes-windows.zip
            artifacts/zeus-testes-windows.zip.sha256
          if-no-files-found: error
      - name: Save sanitized acceptance evidence
        id: evidence
        if: always()
        shell: pwsh
        env:
          ZEUS_BUILD_OUTCOME: ${{ steps.build.outcome }}
          ZEUS_TEST_OUTCOME: ${{ steps.windowsTests.outcome }}
          ZEUS_SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          ZEUS_PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          ZEUS_INSTALLER_TEST_OUTCOME: ${{ steps.installerTest.outcome }}
        run: |
          New-Item -ItemType Directory -Force '.validation/screenshots' | Out-Null
          $projects = @()
          $totals = @{ total = 0; passed = 0; failed = 0; skipped = 0 }
          if (Test-Path $env:ZEUS_TEST_RESULTS) {
            foreach ($file in @(Get-ChildItem $env:ZEUS_TEST_RESULTS -Recurse -Filter '*.trx' | Sort-Object FullName)) {
              [xml]$trx = Get-Content $file.FullName
              $c = $trx.SelectSingleNode("//*[local-name()='Counters']")
              if ($null -eq $c) { continue }
              $counts = [ordered]@{
                project = $file.Directory.Name
                total = [int]$c.total
                passed = [int]$c.passed
                failed = [int]$c.failed
                skipped = [Math]::Max([int]$c.notExecuted, [int]$c.total - [int]$c.executed)
              }
              $projects += $counts
              foreach ($key in @('total', 'passed', 'failed', 'skipped')) { $totals[$key] += $counts[$key] }
            }
          }
          $screenshots = @()
          if (Test-Path $env:ZEUS_VALIDATION_DIR) {
            foreach ($file in @(Get-ChildItem $env:ZEUS_VALIDATION_DIR -Filter 'zeus-*.png' | Sort-Object Name)) {
              Copy-Item $file.FullName (Join-Path '.validation/screenshots' $file.Name)
              $screenshots += $file.Name
            }
          }
          $outcomes = [ordered]@{
            build = $env:ZEUS_BUILD_OUTCOME
            windowsTests = $env:ZEUS_TEST_OUTCOME
            smoke = $env:ZEUS_SMOKE_OUTCOME
            publish = $env:ZEUS_PUBLISH_OUTCOME
            installerTest = $env:ZEUS_INSTALLER_TEST_OUTCOME
          }
          $verified = ($outcomes.Values | Where-Object { $_ -ne 'success' }).Count -eq 0 `
            -and $totals.total -gt 0 -and $totals.passed -eq $totals.total -and $totals.failed -eq 0 -and $totals.skipped -eq 0 `
            -and $projects.Count -ge 6 -and $screenshots.Count -ge 11
          $localRunner = $null
          $localReportPath = Join-Path $env:ZEUS_TEST_RESULTS 'relatorio.json'
          if (Test-Path $localReportPath -PathType Leaf) {
            $localReport = Get-Content $localReportPath -Raw -Encoding utf8 | ConvertFrom-Json
            $localRunner = [ordered]@{
              accepted = $localReport.accepted
              sourceCommit = $localReport.sourceCommit
              stages = $localReport.stages
              failures = $localReport.failures
            }
          }
          $report = [ordered]@{
            schemaVersion = 1
            sourceCommit = $env:ZEUS_SOURCE_SHA
            sourceBranch = $env:ZEUS_SOURCE_BRANCH
            runId = $env:GITHUB_RUN_ID
            runAttempt = $env:GITHUB_RUN_ATTEMPT
            runUrl = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            recordedAtUtc = [DateTimeOffset]::UtcNow.ToString('o')
            runner = 'windows-latest'
            accepted = $verified
            outcomes = $outcomes
            testCounts = $totals
            testProjects = $projects
            localRunner = $localRunner
            failures = @(
              if (Test-Path $env:ZEUS_TEST_RESULTS) {
                foreach ($file in @(Get-ChildItem $env:ZEUS_TEST_RESULTS -Recurse -Filter '*.trx')) {
                  [xml]$trx = Get-Content $file.FullName
                  foreach ($test in @($trx.SelectNodes("//*[local-name()='UnitTestResult' and @outcome='Failed']"))) {
                    $message = $test.SelectSingleNode(".//*[local-name()='Message']")
                    $stack = $test.SelectSingleNode(".//*[local-name()='StackTrace']")
                    [ordered]@{
                      test = $test.testName
                      message = if ($message) { $message.InnerText.Substring(0, [Math]::Min($message.InnerText.Length, 2000)) } else { 'No failure message provided.' }
                      stackTrace = if ($stack) { $stack.InnerText.Substring(0, [Math]::Min($stack.InnerText.Length, 5000)) } else { '' }
                    }
                  }
                }
              }
            )
            screenshots = $screenshots
            limitations = @(
              'Acceptance runs on a Windows CI virtual machine, not on every physical hardware configuration.',
              'Repair, restore-point creation, driver installation, offline scan and reboot are not executed by CI.',
              'CI does not establish measured performance gains or production code-signing status.'
            )
          }
          $report | ConvertTo-Json -Depth 8 | Set-Content '.validation/status.json' -Encoding utf8
      - name: Upload sanitized acceptance evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: zeus-windows-acceptance
          path: .validation/
          include-hidden-files: true
          if-no-files-found: error
      - name: Return validation evidence through Git
        if: ${{ always() && steps.evidence.outcome == 'success' && github.event_name != 'pull_request' }}
        shell: pwsh
        continue-on-error: true
        run: |
          $source = $env:ZEUS_SOURCE_SHA
          if ($source -notmatch '^[0-9a-f]{40}$') { throw 'Unexpected source commit identifier.' }
          $branch = "validation/zeus-$source/run-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          git config user.name 'ZEUS validation bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c $branch
          if ($LASTEXITCODE -ne 0) { throw 'Could not create a dedicated evidence branch.' }
          git add -- .validation/status.json .validation/screenshots
          if ($LASTEXITCODE -ne 0) { throw 'Could not stage sanitized evidence.' }
          git commit -m "Record Windows validation for $source"
          if ($LASTEXITCODE -ne 0) { throw 'Could not commit sanitized evidence.' }
          git push origin "HEAD:refs/heads/$branch"
          if ($LASTEXITCODE -ne 0) { throw 'Git evidence return failed; the Actions evidence artifact is still available.' }
